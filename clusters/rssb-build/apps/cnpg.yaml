# CloudNativePG 1.30.1: the PostgreSQL operator for the build phase (plan, D36).
# It runs the `postgres` Cluster in services/ (one primary, one replica, automatic failover).
# Installed from the project's release manifest in its Git repository at the release tag,
# not from its Helm chart: the chart depends on a dashboards chart served from github.io,
# which Argo CD must fetch to render and which the nodes cannot reach (same block as in the
# lab). The manifest is self-contained: namespace, CRDs, RBAC, the operator, its webhooks.
# Only this cluster runs it; the lab keeps its Docker services next to the laptop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/cloudnative-pg/cloudnative-pg.git
    targetRevision: v1.30.1
    path: releases
    directory:
      include: cnpg-1.30.1.yaml # the folder holds every release; only this one is applied
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  # The operator issues its own webhook certificates and writes the CA into these at
  # runtime. That is expected, not drift (same as KEDA).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
    syncOptions:
      - ServerSideApply=true # the CRDs are too large for client-side apply
