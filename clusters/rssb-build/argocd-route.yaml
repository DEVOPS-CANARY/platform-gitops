# The Argo CD screen through the entry point, like any app: a host name on the public Gateway
# (its "argocd" listener), plain HTTP to the API server (bootstrap/argocd-ha sets
# server.insecure; TLS ends at the Gateway). Until DNS exists (plan, Q22), a hosts-file line
# maps the name to a node and the screen opens on http://argocd.local:30080. Sign in as admin
# (make argocd-password in platform-infra) until SSO (plan, Q9).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: argocd
  hostnames:
    - argocd.local
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
