# The Argo CD screen through the entry point, like any app: on the public Gateway under the
# path /argocd (bootstrap/argocd-ha sets server.rootpath and server.insecure; TLS ends at the
# Gateway), with no host name, so it opens on http://<any node>:30080/argocd/ from the VPN
# without DNS or a hosts file. A DNS name replaces the path later (plan, Q22). Sign in as
# admin (the initial admin secret, read on node-1) until SSO (plan, Q9).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /argocd
      backendRefs:
        - name: argocd-server
          port: 80
